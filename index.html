<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0C0C10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F4EF" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Finanzas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="preload" href="fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="login" id="login" aria-label="Iniciar sesión" hidden>
  <div class="lg-mid">
    <div class="lg-mark"><svg viewBox="0 0 34 34" aria-hidden="true"><g fill="currentColor"><rect x="3" y="19" width="7" height="12" rx="2"/><rect x="13.5" y="12" width="7" height="19" rx="2"/><rect x="24" y="5" width="7" height="26" rx="2"/></g></svg></div>
    <h1 class="lg-title">Finanzas</h1>
    <p class="lg-tag">Tus pagos y abonos, en orden y entre dos.</p>
    <div class="lg-prev" aria-hidden="true">
      <div class="lg-pr b"><span>▲</span>Renta<b>$1,500</b></div>
      <div class="lg-pr w"><span>◷</span>Internet<b>$450</b></div>
      <div class="lg-pr ok"><span>✓</span>Ahorro<b>$1,200</b></div>
    </div>
  </div>
  <button type="button" class="lg-btn" id="login-google"><i class="lg-g"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.4-4 6.9-10 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg></i>Continuar con Google</button>
  <p class="lg-nota">Tus datos se guardan en tu cuenta y se sincronizan entre tus teléfonos.</p>
</section>

<section class="login" id="invita" aria-label="Invitación para compartir finanzas" hidden>
  <div class="lg-mid">
    <h1 class="inv-title" id="inv-de"></h1>
    <p class="lg-tag inv-tag">Para llevar juntos los pagos y abonos. Lo que ya tienes en tu app se junta con lo suyo; nada se borra.</p>
    <div class="lg-prev inv-card">
      <div class="mem"><i class="av av-e" id="inv-av"></i><span><b id="inv-nombre"></b><small id="inv-de-email"></small></span></div>
      <p class="s-sub" id="inv-pagos"></p>
    </div>
    <p class="form-error" id="inv-error" role="alert"></p>
  </div>
  <button type="button" class="lg-btn" id="inv-si">Aceptar y unirme</button>
  <button type="button" class="lg-btn lg-btn-soft" id="inv-no">Ahora no</button>
</section>

<div class="app">
  <header class="header">
    <div class="header-title-row">
      <button type="button" class="hp-label" id="month-label" data-action="month-picker" aria-haspopup="dialog">
        <span id="month-text"></span>
      </button>
    </div>
  </header>

  <main>
  <div class="search" id="search-bar" hidden>
    <input type="search" id="search" placeholder="Buscar concepto o categoría" autocomplete="off" aria-label="Buscar concepto o categoría">
  </div>

  <section class="hero" aria-label="Resumen">
    <div id="kpi-dash"></div>
  </section>

  <section class="controls" aria-label="Filtros">
    <div class="chips" id="chips" role="group" aria-label="Filtrar por estado"></div>
  </section>

  <div class="list-head">
    <div class="list-title"><span id="list-caption"></span><span id="list-count"></span></div>
    <div class="seg" id="seg" role="group" aria-label="Agrupar por">
      <button type="button" id="g-urg" data-action="group" data-group="urgencia" aria-pressed="true" aria-label="Agrupar por urgencia" title="Por urgencia">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button type="button" id="g-cat" data-action="group" data-group="categoria" aria-pressed="false" aria-label="Agrupar por categoría" title="Por categoría">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
    </div>
  </div>
  <div id="list"></div>
  <section id="perfil" class="perfil" aria-label="Perfil" hidden></section>
  <p class="app-ver" id="app-ver"></p>
  </main>
</div>

<nav class="bottom-nav" aria-label="Secciones">
  <div class="bottom-nav-inner" id="view-switch">
    <button type="button" class="nav-btn" data-action="view" data-view="provisional">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3" stroke-dasharray="3 2.5"/><path d="M8 12h8"/></svg>Inicio
    </button>
    <button type="button" class="nav-btn" data-action="view" data-view="calendario">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendario
    </button>
    <button type="button" class="nav-add" data-action="add" aria-label="Agregar">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" class="nav-btn" data-action="view" data-view="analisis">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18"/><path d="M6 16v-5M11 16V5M16 16v-8M20 16v-3"/></svg>Análisis
    </button>
    <button type="button" class="nav-btn" data-action="view" data-view="perfil">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2.5"/><circle cx="9" cy="12" r="2.5"/><circle cx="17" cy="18" r="2.5"/></svg>Ajustes
    </button>
  </div>
</nav>

<div class="sheet-backdrop" id="sheet" data-action="backdrop" hidden>
  <div class="sheet" id="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button type="button" class="icon-btn" data-action="close-sheet" aria-label="Cerrar">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
<script>if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });</script>
</body>
</html>
