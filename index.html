<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef0ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Finanzas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<script>
/* Aplica el tema antes de pintar para evitar el parpadeo. */
(function () {
  try {
    var t = localStorage.getItem('finanzas_theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.content = t === 'dark' ? '#0d1311' : '#eef0ed';
  } catch (e) {}
})();
</script>
<link rel="preload" href="fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-title-row">
      <button type="button" class="hp-label" id="month-label" data-action="month-picker" aria-haspopup="dialog">
        <span id="month-text"></span>
      </button>
    </div>
  </header>

  <main>
  <div class="search" id="search-bar" hidden>
    <input type="search" id="search" placeholder="Buscar concepto o categoría" autocomplete="off" aria-label="Buscar concepto o categoría">
  </div>

  <section class="hero" aria-label="Resumen">
    <div id="kpi-dash"></div>
  </section>

  <section class="controls" aria-label="Filtros">
    <div class="chips" id="chips" role="group" aria-label="Filtrar por estado"></div>
  </section>

  <div class="list-head">
    <div class="list-title"><span id="list-caption"></span><span id="list-count"></span></div>
    <div class="seg" id="seg" role="group" aria-label="Agrupar por">
      <button type="button" id="g-urg" data-action="group" data-group="urgencia" aria-pressed="true" aria-label="Agrupar por urgencia" title="Por urgencia">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button type="button" id="g-cat" data-action="group" data-group="categoria" aria-pressed="false" aria-label="Agrupar por categoría" title="Por categoría">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
    </div>
  </div>
  <div id="list"></div>
  <section id="perfil" class="perfil" aria-label="Perfil" hidden></section>
  </main>
</div>

<nav class="bottom-nav" aria-label="Secciones">
  <div class="bottom-nav-inner" id="view-switch">
    <button type="button" class="nav-btn" data-action="view" data-view="gastos" aria-current="page">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/></svg>Pagos
    </button>
    <button type="button" class="nav-add" data-action="add" aria-label="Agregar">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" class="nav-btn" data-action="view" data-view="metas">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Metas
    </button>
    <button type="button" class="nav-btn" data-action="view" data-view="perfil">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>Perfil
    </button>
  </div>
</nav>

<div class="sheet-backdrop" id="sheet" data-action="backdrop" hidden>
  <div class="sheet" id="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button type="button" class="icon-btn" data-action="close-sheet" aria-label="Cerrar">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
<script>if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });</script>
</body>
</html>
